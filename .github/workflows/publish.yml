name: Publish

# Canary: every push to main touching the package paths below.
# Stable (@latest): only a pushed vX.Y.Z tag, so the release is always traceable to a
# tag. The release job checks the tag matches packages/ui/package.json, is on main and
# has a CHANGELOG.md entry. Both channels use npm trusted publishing (OIDC) with
# provenance; this workflow holds no npm token and never creates tags itself.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # Not evaluated for tag pushes.
    paths:
      - "packages/ui/**"
      - "scripts/release-guard*"
      - "CHANGELOG.md"
      - "cliff.toml"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish.yml"

# A newer main push supersedes an in-flight canary; a release is never cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --test scripts/release-guard.test.mjs

      - name: Lint
        run: pnpm -F @vllnt/ui lint

      - name: Typecheck
        run: pnpm -F @vllnt/ui exec tsc --noEmit --project tsconfig.build.json

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:once

  canary:
    name: Publish Canary
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish canary
        working-directory: packages/ui
        run: |
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          CANARY_VERSION=$(node ../../scripts/release-guard.mjs web-canary)
          npm version "$CANARY_VERSION" --no-git-tag-version
          TARBALL=$(pnpm pack --pack-destination /tmp | tail -1)
          npx --yes npm@11.18.0 publish "$TARBALL" --tag canary --provenance --access public

  release:
    name: Publish Release
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Protected environment: required reviewer, so every stable publish waits for an
    # explicit maintainer approval. Its deployment rules must allow v*.*.* tags.
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and branches: the tagged commit is checked against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify release tag
        id: version
        working-directory: packages/ui
        run: |
          # The guard fails closed unless the tag is v<packages/ui version> on a supported base.
          VERSION=$(node ../../scripts/release-guard.mjs stable)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Tag a commit that is already on origin/main."
            exit 1
          fi

      - name: Read changelog release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            /^## / {
              if (capture) exit
              if (index($0, "## [" version "]") == 1) {
                capture = 1
                next
              }
            }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG.md must include a ${VERSION} release section before tagging."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        working-directory: packages/ui
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          PKG=$(node -p "require('./package.json').name")
          # A re-run after a later step failed must not try to republish. Only a registry
          # E404 means "not published"; any other npm view failure aborts the step here.
          PUBLISHED=$(bash "$GITHUB_WORKSPACE/scripts/npm-published.sh" "${PKG}@${VERSION}")
          if [ "$PUBLISHED" = yes ]; then
            echo "${PKG}@${VERSION} is already published"
          else
            TARBALL=$(pnpm pack --pack-destination /tmp | tail -1)
            npx --yes npm@11.18.0 publish "$TARBALL" --tag latest --provenance --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/release-notes.md
