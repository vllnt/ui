name: Storybook

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/ui/src/**"
      - "packages/ui/.storybook/**"
      - "packages/ui/scripts/**"
      - "packages/ui/styles.css"
      - "packages/ui/themes/**"
      - "packages/ui/.snapshots/**"
      - "packages/ui/playwright/**"
      - "packages/ui/playwright-ct.config.ts"
      - "packages/ui/postcss.config.mjs"
      - "packages/ui/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/storybook.yml"
  push:
    branches: [main]
    paths:
      - "packages/ui/src/**"
      - "packages/ui/.storybook/**"
      - "packages/ui/styles.css"
      - "packages/ui/themes/**"
      - "packages/ui/.snapshots/**"
      - "packages/ui/playwright/**"
      - "packages/ui/playwright-ct.config.ts"
      - "packages/ui/postcss.config.mjs"
      - "packages/ui/scripts/**"
      - "packages/ui/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/storybook.yml"

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify-stories:
    name: Verify Stories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check story coverage
        working-directory: packages/ui
        run: pnpm exec tsx scripts/check-story-coverage.ts

      - name: Verify story props
        working-directory: packages/ui
        run: pnpm exec tsx scripts/verify-stories.ts

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        working-directory: packages/ui
        run: pnpm build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v5
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  test-storybook:
    name: Storybook Tests
    needs: build-storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -F @vllnt/ui exec playwright install --with-deps chromium

      - name: Download Storybook artifact
        uses: actions/download-artifact@v5
        with:
          name: storybook-static
          path: packages/ui/storybook-static

      - name: Install http-server
        run: npm install -g http-server@14.1.1

      - name: Run Storybook test-runner
        working-directory: packages/ui
        run: |
          http-server storybook-static --port 6006 --silent &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:6006 > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          pnpm test-storybook --url http://127.0.0.1:6006 --maxWorkers=2
          kill $SERVER_PID 2>/dev/null || true

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compare committed visual baselines
        working-directory: packages/ui
        run: pnpm test:visual --workers=2 --update-snapshots=none

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: visual-snapshots
          path: packages/ui/.snapshots/linux
          include-hidden-files: true
          retention-days: 30

      - name: Upload visual test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: visual-test-results
          path: |
            packages/ui/playwright-report
            packages/ui/test-results
          retention-days: 7
