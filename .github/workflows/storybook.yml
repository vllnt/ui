name: Storybook

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/ui/src/**"
      - "packages/ui/.storybook/**"
      - "packages/ui/scripts/**"
      - "packages/ui/styles.css"
      - "packages/ui/themes/**"
      - ".github/workflows/storybook.yml"
  push:
    branches: [main]
    paths:
      - "packages/ui/src/**"
      - "packages/ui/.storybook/**"

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify-stories:
    name: Verify Stories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify story coverage and props
        working-directory: packages/ui
        run: pnpm exec tsx scripts/verify-stories.ts

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        working-directory: packages/ui
        run: pnpm build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  test-storybook:
    name: Storybook Tests
    needs: build-storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -F @vllnt/ui exec playwright install --with-deps chromium

      - name: Download Storybook artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static

      - name: Run Storybook test-runner
        working-directory: packages/ui
        run: |
          python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static > /dev/null 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:6006 > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          pnpm test-storybook --url http://127.0.0.1:6006 --maxWorkers=2 --testTimeout=60000
          kill $SERVER_PID 2>/dev/null || true

  visual-regression:
    name: Visual Regression
    needs: build-storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -F @vllnt/ui exec playwright install --with-deps chromium

      - name: Run Playwright CT visual tests
        working-directory: packages/ui
        run: pnpm test:visual --update-snapshots

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-snapshots
          path: packages/ui/.snapshots
          retention-days: 30

      - name: Upload visual test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-test-results
          path: |
            packages/ui/playwright-report
            packages/ui/test-results
          retention-days: 7
