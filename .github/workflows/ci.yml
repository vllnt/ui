name: CI

on:
  pull_request:
    # s3/** integration branches get the same gates as main, so a combined branch is never
    # merged into main untested.
    branches: [main, "s3/**"]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Node built-ins only: no install, fails fast, and runs on every PR whatever it touches
  # (the publish workflows and release scripts included).
  repo:
    name: Repo Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check release guard
        run: node --test scripts/release-guard.test.mjs

      - name: Check the atomic level checker
        run: node --test scripts/check-atomic-levels.test.mjs

      - name: Check the native health alert
        run: node --test scripts/native-health.test.mjs

  # WEB lane (docs/agents/LANES.md): @vllnt/ui, the registry and Storybook, plus the shared
  # packages they build on.
  web:
    name: Web Quality Gates
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -F @vllnt/ui lint

      - name: Lint registry
        run: pnpm -F @vllnt/ui-registry lint

      - name: Check atomic design levels
        run: pnpm -F @vllnt/ui check:atomic

      - name: Typecheck
        run: pnpm -F @vllnt/ui exec tsc --noEmit --project tsconfig.build.json

      # The web packages and everything they depend on; the native packages build in
      # "Native Package Gates".
      - name: Build
        run: pnpm turbo build --concurrency=2 --filter='@vllnt/ui-registry...' --filter='@vllnt/ui...'

      - name: Check bundle size budgets
        run: pnpm -F @vllnt/ui size

      - name: Check deep imports in dist resolve under Node ESM
        run: pnpm -F @vllnt/ui check:dist-imports

      - name: Check registry drift
        run: pnpm -F @vllnt/ui-registry registry:check

      - name: Check registry integrity
        run: pnpm -F @vllnt/ui-registry registry:integrity

      - name: Test
        run: pnpm turbo test:once --concurrency=2 --filter=@vllnt/ui --filter=@vllnt/ui-registry

      - name: Check "use client" directives
        run: pnpm -F @vllnt/ui check:use-client

      - name: Verify stories
        working-directory: packages/ui
        run: npx tsx scripts/verify-stories.ts

      - name: Build Storybook
        working-directory: packages/ui
        run: pnpm build-storybook

      - name: Verify component previews resolve to real stories
        run: pnpm -F @vllnt/ui-registry registry:verify-previews

      - name: Install Playwright browser
        run: pnpm -F @vllnt/ui-registry exec playwright install --with-deps chromium

      # The build above produced the registry. Serve it as production would, on
      # localhost (the standalone server redirects in a loop on 127.0.0.1), and run
      # the guards for cookie-free public pages, cache headers and layout shift.
      - name: Check cookies, caching and layout shift on the production build
        working-directory: apps/registry
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
        run: |
          pnpm exec next start --hostname localhost --port 3100 &
          for _ in $(seq 1 60); do curl -fs http://localhost:3100/healthz > /dev/null && break; sleep 1; done
          curl -fs http://localhost:3100/healthz > /dev/null
          pnpm exec playwright test e2e/static-catalog.spec.ts e2e/shell-stability.spec.ts

  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.areas.outputs.core }}
      native: ${{ steps.areas.outputs.native }}
      web: ${{ steps.areas.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: areas
        name: Map changed files to affected job groups
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            printf 'core=true\nnative=true\nweb=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          # SHARED paths (docs/agents/LANES.md) trigger every lane.
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|\.node-version|\.github/workflows/ci\.yml|packages/design/|packages/ui-core/)'
          core="$shared"
          native="$shared|^(packages/ui-native/|apps/native-catalog/|scripts/check-atomic-levels)"
          web="$shared|^(packages/ui/|apps/registry/|apps/storybook/|scripts/check-atomic-levels)"
          {
            if grep -qE "$core" <<< "$changed"; then echo "core=true"; else echo "core=false"; fi
            if grep -qE "$native" <<< "$changed"; then echo "native=true"; else echo "native=false"; fi
            if grep -qE "$web" <<< "$changed"; then echo "web=true"; else echo "web=false"; fi
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # SHARED tokens and @vllnt/ui-core, which both lanes consume.
  core:
    name: Core Quality Gates
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter '@vllnt/ui-core...' --filter '@vllnt/design-source...'

      - name: Check generated tokens are in sync
        run: pnpm tokens:check

      - name: Lint and test the token source
        run: pnpm -F @vllnt/design-source lint && pnpm -F @vllnt/design-source test:once

      - name: Lint ui-core
        run: pnpm -F @vllnt/ui-core lint

      - name: Typecheck ui-core
        run: pnpm -F @vllnt/ui-core typecheck

      - name: Build ui-core
        run: pnpm -F @vllnt/ui-core build

      - name: Test ui-core
        run: pnpm -F @vllnt/ui-core test:once

      - name: Check the ui-core package contents
        run: pnpm -F @vllnt/ui-core pack:check

  native:
    name: Native Package Gates
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify native packages and Expo bundles
        run: pnpm ci:native

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -F @vllnt/ui-registry exec playwright install --with-deps chromium

      - name: Generate registry artifacts
        run: pnpm -F @vllnt/ui-registry registry:build

      - name: Run E2E tests
        run: pnpm -F @vllnt/ui-registry test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/registry/playwright-report
          retention-days: 7

  # One always-reporting check for branch protection: it passes when every lane job either
  # passed or was skipped as unaffected, and fails on any failure or cancellation.
  required:
    name: required
    if: always()
    needs: [changes, repo, web, core, native, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every affected lane passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo "::error::A required CI job failed or was cancelled"
            exit 1
          fi
