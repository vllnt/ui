name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -F @vllnt/ui lint

      - name: Lint registry
        run: pnpm -F @vllnt/ui-registry lint

      - name: Check atomic design levels
        run: node --test scripts/check-atomic-levels.test.mjs && pnpm check:atomic

      - name: Typecheck
        run: pnpm -F @vllnt/ui exec tsc --noEmit --project tsconfig.build.json

      - name: Build
        run: pnpm build

      - name: Check bundle size budgets
        run: pnpm -F @vllnt/ui size

      - name: Check deep imports in dist resolve under Node ESM
        run: pnpm -F @vllnt/ui check:dist-imports

      - name: Check registry drift
        run: pnpm -F @vllnt/ui-registry registry:check

      - name: Check registry integrity
        run: pnpm -F @vllnt/ui-registry registry:integrity

      - name: Test
        run: pnpm test:once

      - name: Check "use client" directives
        run: pnpm -F @vllnt/ui check:use-client

      - name: Verify stories
        working-directory: packages/ui
        run: npx tsx scripts/verify-stories.ts

      - name: Build Storybook
        working-directory: packages/ui
        run: pnpm build-storybook

      - name: Verify component previews resolve to real stories
        run: pnpm -F @vllnt/ui-registry registry:verify-previews

  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.areas.outputs.native }}
      web: ${{ steps.areas.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: areas
        name: Map changed files to affected job groups
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|\.node-version|\.github/workflows/ci\.yml|packages/design/)'
          native="$shared|^(packages/ui-core/|packages/ui-native/|apps/native-catalog/|scripts/check-atomic-levels)"
          web="$shared|^(packages/ui/|packages/ui-core/|packages/ui-native/|apps/registry/)"
          if grep -qE "$native" <<< "$changed"; then echo "native=true"; else echo "native=false"; fi >> "$GITHUB_OUTPUT"
          if grep -qE "$web" <<< "$changed"; then echo "web=true"; else echo "web=false"; fi >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  native:
    name: Native Package Gates
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify native packages and Expo bundles
        run: pnpm ci:native

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -F @vllnt/ui-registry exec playwright install --with-deps chromium

      - name: Generate registry artifacts
        run: pnpm -F @vllnt/ui-registry registry:build

      - name: Run E2E tests
        run: pnpm -F @vllnt/ui-registry test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/registry/playwright-report
          retention-days: 7
