name: Core and Native Canary

# Canary builds of @vllnt/ui-core and @vllnt/ui-native, from main, on the `canary` dist-tag only.
# The workflow file name is what npm trusted publishing is bound to: do not rename it.
#
# Two publish paths, each behind its own repository variable. Unset (the default) means the job is
# skipped, not failed:
#   CORE_CANARY_PUBLISH_ENABLED   = true  -> core-publish   @vllnt/ui-core, after core-quality only
#   NATIVE_CANARY_PUBLISH_ENABLED = true  -> native-publish @vllnt/ui-core + @vllnt/ui-native,
#                                            after native-quality (pnpm ci:native, Expo Doctor)
# Nothing publishes until the owner sets them. Setup: docs/RELEASING.md.

on:
  push:
    branches: [main]
    paths:
      - "packages/design/**"
      - "scripts/release-guard*"
      - "scripts/publish-canary*"
      - "packages/ui-core/**"
      - "packages/ui-native/**"
      - "apps/native-catalog/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/native-canary.yml"

permissions:
  contents: read

jobs:
  core-quality:
    name: Core Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # ui-core and what it needs only. Expo and the React Native toolchain are not installed,
      # and nothing below runs ci:native or Expo Doctor.
      - run: pnpm install --frozen-lockfile --filter '@vllnt/ui-core...'

      - run: node --test scripts/release-guard.test.mjs

      - run: pnpm -F @vllnt/ui-core lint

      - run: pnpm -F @vllnt/ui-core typecheck

      # Includes the design token drift check (tokens:check).
      - run: pnpm -F @vllnt/ui-core build

      - run: pnpm -F @vllnt/ui-core test:once

      - run: pnpm -F @vllnt/ui-core pack:check

  core-publish:
    name: Publish Core Canary
    needs: core-quality
    if: ${{ vars.CORE_CANARY_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same environment as native-publish: one trusted-publisher entry per package covers both jobs.
    environment: npm-native-canary
    # Publishes of one kind queue instead of running together; a superseded one stands down.
    concurrency:
      group: native-canary-core-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile --filter '@vllnt/ui-core...'

      - name: Build publication artifacts
        run: pnpm -F @vllnt/ui-core build

      - name: Publish core canary
        run: bash scripts/publish-canary.sh core

  native-quality:
    name: Native Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --test scripts/release-guard.test.mjs

      - run: pnpm ci:native

  native-publish:
    name: Publish Native Canary Pair
    # Waits for core-publish (skipped is fine, failed is not) so the two never write the same
    # core version at once; a core version core-publish already pushed for this commit is reused.
    needs: [native-quality, core-publish]
    if: ${{ !cancelled() && vars.NATIVE_CANARY_PUBLISH_ENABLED == 'true' && needs.native-quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.core-publish.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-native-canary
    concurrency:
      group: native-canary-pair-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build publication artifacts
        run: pnpm --filter '@vllnt/ui-native...' build

      - name: Publish synchronized canaries
        env:
          NPM_DIST_TAG_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: bash scripts/publish-canary.sh pair
