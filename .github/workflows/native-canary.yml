name: Native Canary

# Canary-only npm publication of @vllnt/ui-core and @vllnt/ui-native on push to main. There is no
# stable path and no manual dispatch here, and nothing publishes unless its repository variable is
# "true" (both are off by default):
#
#   core-quality -> publish-core   CORE_CANARY_PUBLISH    ui-core alone, gated only on its own checks
#   quality      -> publish        NATIVE_CANARY_PUBLISH  ui-core + ui-native pair, gated on the full
#                                                         native gate (pnpm ci:native, Expo Doctor)
#
# Both publish jobs run scripts/publish-canary.sh from this one workflow file and one environment,
# so each package needs a single npm trusted-publisher entry. The pair job waits for publish-core,
# so a run never uploads ui-core twice; ui-core's canary never waits for native or Expo.

on:
  push:
    branches: [main]
    paths:
      - "packages/design/**"
      - "scripts/release-guard*"
      - "scripts/publish-canary*"
      - "packages/ui-core/**"
      - "packages/ui-native/**"
      - "apps/native-catalog/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/native-canary.yml"

concurrency:
  group: native-canary-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  core-quality:
    name: Core Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --test scripts/release-guard.test.mjs scripts/publish-canary.test.mjs

      # The ui-core steps of `pnpm ci:native`; ui-core has no Expo dependency.
      - run: pnpm tokens:check

      - run: pnpm -F @vllnt/ui-core lint

      - run: pnpm -F @vllnt/ui-core typecheck

      - run: pnpm --filter '@vllnt/ui-core...' build

      - run: pnpm -F @vllnt/ui-core test:once

      - run: pnpm -F @vllnt/ui-core pack:check

  publish-core:
    name: Publish Core Canary
    # Off until the repository variable CORE_CANARY_PUBLISH is "true".
    if: ${{ vars.CORE_CANARY_PUBLISH == 'true' }}
    needs: core-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-native-canary
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build publication artifacts
        run: pnpm --filter '@vllnt/ui-core...' build

      - name: Publish core canary
        env:
          NPM_DIST_TAG_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: bash scripts/publish-canary.sh core

  quality:
    name: Native Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --test scripts/release-guard.test.mjs scripts/publish-canary.test.mjs

      - run: pnpm ci:native

  publish:
    name: Publish Native Canary Pair
    # Off until the repository variable NATIVE_CANARY_PUBLISH is "true". Stays behind the native
    # quality gate, Expo Doctor included. publish-core is skipped when its variable is off; when it
    # ran and failed, the pair does not publish either.
    if: ${{ !cancelled() && vars.NATIVE_CANARY_PUBLISH == 'true' && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.publish-core.result) }}
    needs: [quality, publish-core]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-native-canary
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build publication artifacts
        run: pnpm --filter '@vllnt/ui-native...' build

      - name: Publish synchronized canaries
        env:
          NPM_DIST_TAG_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: bash scripts/publish-canary.sh pair
