name: Native Verify Published

# Re-validates a PUBLISHED @vllnt/ui-core + @vllnt/ui-native pair from the npm tarballs, by hand:
# for a release candidate, or to repeat a canary check. It is manual-only on purpose. The check for
# each canary runs in native-canary.yml, right after the pair publishes (job verify-published),
# on the commit that was pushed, not on a checkout of someone else's head.
#
# The check is apps/native-catalog/scripts/verify-published.mjs: a clean Expo app and a copy of
# apps/native-catalog, each installed from npm outside the workspace (typecheck, Jest,
# `expo export` for iOS and Android). The catalog sources and tests under test come from the ref
# this workflow runs on, so run it from the commit or tag the pair was built from.
#
# Read-only and secret-free: it only talks to the public npm registry.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version of @vllnt/ui-native and @vllnt/ui-core, or a dist-tag of ui-native
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Published Pair
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No package cache: the scratch installs must resolve from the registry, not from a restored store.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Verify the published pair
        env:
          VERSION: ${{ inputs.version }}
        run: node apps/native-catalog/scripts/verify-published.mjs "$VERSION"
