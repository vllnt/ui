name: react-doctor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan codebase health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: react-doctor (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec react-doctor . \
            --diff origin/${{ github.base_ref }} \
            --annotations \
            --fail-on error \
            --offline

      - name: react-doctor (full scan on main)
        if: github.event_name == 'push'
        run: |
          pnpm exec react-doctor . \
            --json \
            --offline > rd-report.json
          jq '.summary' rd-report.json

      - name: Upload report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: react-doctor-report
          path: rd-report.json
          retention-days: 30
