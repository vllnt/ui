version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  # The cooldown matches the repo's 7-day minimum release age for npm packages.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
