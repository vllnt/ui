packages:
  - "apps/*"
  - "packages/*"

# Supply-chain settings (pnpm 11). A dependency version must be at least
# 7 days old before it can be resolved; first-party @vllnt packages are exempt.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@vllnt/*"
# Fail the install when a dependency has an install script that is not
# listed in allowBuilds, and refuse git/tarball URLs in transitive deps.
strictDepBuilds: true
blockExoticSubdeps: true

# Security overrides. Each one pins a patched release for a transitive
# dependency whose parent cannot move yet; drop it once the parent does.
overrides:
  "eslint-plugin-react-hooks": "7.0.1"
  "hono": "4.13.13"
  "@hono/node-server": "2.1.3"
  "express-rate-limit": "8.2.2"
  "axios": "1.20.0"
  "follow-redirects": "1.16.1"
  "fast-uri": "3.1.9"
  "ip-address": "10.7.4"
  "minimatch": ">=10.2.3"
  "eslint-plugin-react>minimatch": "^3.1.2"
  "eslint-plugin-jsx-a11y>minimatch": "^3.1.2"
  "ajv": ">=8.18.0"
  "@eslint/eslintrc>ajv": "^6.12.4"
  "eslint>ajv": "^6.12.4"
  "qs": ">=6.14.2"
  "rollup": ">=4.59.0"
  "next": "16.4.3"
  "@playwright/experimental-ct-core>vite": "6.4.5"
  "@storybook/builder-vite>vite": "7.3.7"
  "@storybook/csf-plugin>vite": "7.3.7"
  "@storybook/react-vite>vite": "7.3.7"
  "@joshwooding/vite-plugin-react-docgen-typescript>vite": "7.3.7"
  "@vitejs/plugin-react>vite": "7.3.7"
  "@vitest/mocker>vite": "7.3.7"
  "vitest>vite": "7.3.7"
  "picomatch@<2.3.2": "2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "4.0.4"
  "lodash": ">=4.18.1"
  "flatted": ">=3.4.2"
  "postcss": ">=8.5.10"
  "ws@>=8.0.0 <8.21.0": "8.21.3"
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  "handlebars@<4.7.10": "4.7.10"
  "proxy-addr@<2.0.8": "2.0.8"
  "shell-quote@<1.11.0": "1.11.0"
  "uuid@<11.1.1": "11.1.1"
  "postcss-selector-parser@<6.1.5": "6.1.5"
  "valibot@<1.4.2": "1.5.0"
  "deepmerge-ts@<8.0.0": "8.0.2"
  "@storybook/test-runner>jest": "30.4.2"
  "@storybook/test-runner>jest-circus": "30.4.2"
  "@storybook/test-runner>jest-environment-node": "30.4.1"
  "@storybook/test-runner>jest-runner": "30.4.2"

# Dependency install scripts: deny by default. With strictDepBuilds, a package
# whose script is not listed here fails the install. Every entry is blocked:
# the native binaries ship as optionalDependencies, so builds, tests and CI
# pass without running any of these scripts.
allowBuilds:
  "@parcel/watcher": false # prebuilt binaries come from optionalDependencies; the script only compiles a fallback
  "@swc/core": false # platform binary comes from optionalDependencies; postinstall is a sanity check
  esbuild: false # binary comes from @esbuild/* optionalDependencies; postinstall only validates it
  msw: false # postinstall copies a service worker into a public dir; not used here
  unrs-resolver: false # napi-postinstall only fetches a fallback wasm binary
